<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drift Racer</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
}

body {
  background: #08090d;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

#game {
  display: block;
  width: 100vw;
  height: 100vh;
  background: #151a17;
}

#hud {
  position: fixed;
  top: 15px;
  left: 15px;
  right: 15px;
  z-index: 5;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
}

.panel {
  background: rgba(0,0,0,.65);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 12px;
  padding: 12px 16px;
  backdrop-filter: blur(8px);
}

.panel div {
  margin: 4px 0;
}

#nitroBar {
  width: 160px;
  height: 10px;
  background: #333;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 6px;
}

#nitroFill {
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg,#00bfff,#7c4dff);
}

#menu {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle,#18232c,#050608);
}

.menuBox {
  width: min(90%,420px);
  padding: 35px;
  text-align: center;
  background: rgba(15,18,24,.95);
  border: 1px solid #333;
  border-radius: 20px;
  box-shadow: 0 20px 70px #000;
}

.menuBox h1 {
  font-size: 48px;
  color: #ff304f;
  font-style: italic;
  margin-bottom: 10px;
}

.menuBox p {
  color: #aaa;
  margin-bottom: 25px;
}

button {
  border: none;
  border-radius: 10px;
  padding: 14px 25px;
  background: #ff304f;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #ff163a;
  transform: scale(1.03);
}

#controls {
  position: fixed;
  bottom: 20px;
  left: 20px;
  right: 20px;
  display: flex;
  justify-content: space-between;
  z-index: 10;
  pointer-events: none;
}

.controlGroup {
  display: flex;
  gap: 10px;
}

.control {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.25);
  background: rgba(0,0,0,.6);
  color: white;
  font-size: 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
  touch-action: none;
}

#driftButton {
  background: rgba(255,48,79,.75);
}

@media (min-width: 800px) {
  #controls {
    display: none;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

  <div class="panel">
    <div>🏁 Volta: <b id="lap">1/3</b></div>
    <div>🏆 Pontos: <b id="score">0</b></div>
    <div>💨 Velocidade: <b id="speed">0</b></div>
  </div>

  <div class="panel">
    <div>⚡ Nitro</div>
    <div id="nitroBar">
      <div id="nitroFill"></div>
    </div>
  </div>

</div>

<div id="menu">
  <div class="menuBox">
    <h1>DRIFT</h1>
    <p>Corra, derrape e faça a maior pontuação!</p>

    <button id="startButton">
      COMEÇAR CORRIDA
    </button>

    <p style="margin-top:20px;font-size:13px">
      PC: WASD / Setas + Espaço para drift
    </p>
  </div>
</div>

<div id="controls">

  <div class="controlGroup">
    <button class="control" data-key="ArrowLeft">←</button>
    <button class="control" data-key="ArrowDown">↓</button>
    <button class="control" data-key="ArrowRight">→</button>
  </div>

  <div class="controlGroup">
    <button class="control" data-key="Space" id="driftButton">DRIFT</button>
    <button class="control" data-key="ArrowUp">↑</button>
  </div>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();

/* =========================
   CONTROLES
========================= */

const keys = {};

window.addEventListener("keydown", e => {
  keys[e.code] = true;

  if (
    ["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"]
    .includes(e.code)
  ) {
    e.preventDefault();
  }
});

window.addEventListener("keyup", e => {
  keys[e.code] = false;
});

/* Controles mobile */

document.querySelectorAll(".control").forEach(button => {

  const key = button.dataset.key;

  const down = e => {
    e.preventDefault();
    keys[key] = true;
  };

  const up = e => {
    e.preventDefault();
    keys[key] = false;
  };

  button.addEventListener("pointerdown", down);
  button.addEventListener("pointerup", up);
  button.addEventListener("pointercancel", up);
  button.addEventListener("pointerleave", up);
});

/* =========================
   JOGO
========================= */

let running = false;
let score = 0;
let lap = 1;
let nitro = 100;
let distance = 0;

const roadWidth = 260;

/*
  Pontos da pista.
  O carro percorre esses pontos
  formando uma pista sinuosa.
*/

const track = [
  {x:0, y:0},
  {x:500, y:0},
  {x:900, y:200},
  {x:1050, y:600},
  {x:850, y:950},
  {x:400, y:1100},
  {x:-100, y:950},
  {x:-350, y:550},
  {x:-250, y:150}
];

/* =========================
   CARRO
========================= */

const car = {
  x: 0,
  y: 0,
  angle: 0,
  speed: 0,
  vx: 0,
  vy: 0,
  width: 34,
  height: 60
};

/* =========================
   CÂMERA
========================= */

const camera = {
  x: 0,
  y: 0
};

/* =========================
   FUNÇÕES
========================= */

function resetGame() {

  car.x = track[0].x;
  car.y = track[0].y;

  car.angle = 0;

  car.speed = 0;
  car.vx = 0;
  car.vy = 0;

  camera.x = car.x;
  camera.y = car.y;

  score = 0;
  lap = 1;
  nitro = 100;
  distance = 0;

  updateHUD();
}

function startGame() {

  document.getElementById("menu").style.display = "none";

  resetGame();

  running = true;

  requestAnimationFrame(gameLoop);
}

/* =========================
   FÍSICA
========================= */

function updateCar() {

  if (!running) return;

  const up =
    keys.ArrowUp || keys.KeyW;

  const down =
    keys.ArrowDown || keys.KeyS;

  const left =
    keys.ArrowLeft || keys.KeyA;

  const right =
    keys.ArrowRight || keys.KeyD;

  const drifting =
    keys.Space;

  /*
    Aceleração
  */

  if (up) {
    car.speed += 0.18;
  }

  if (down) {
    car.speed -= 0.13;
  }

  /*
    Atrito
  */

  car.speed *= 0.985;

  /*
    Limite de velocidade
  */

  let maxSpeed = 8;

  /*
    Nitro
  */

  if (
    keys.ShiftLeft ||
    keys.ShiftRight
  ) {

    if (nitro > 0) {

      car.speed += 0.25;
      nitro -= 0.7;

    }

  } else {

    nitro += 0.12;

  }

  nitro = Math.max(
    0,
    Math.min(100, nitro)
  );

  /*
    Direção
  */

  const steering =
    (right ? 1 : 0) -
    (left ? 1 : 0);

  if (Math.abs(car.speed) > 0.2) {

    let turnPower = 0.045;

    if (drifting) {
      turnPower = 0.075;
    }

    car.angle +=
      steering *
      turnPower *
      (car.speed / maxSpeed);

  }

  /*
    Movimento
  */

  const forwardX =
    Math.sin(car.angle);

  const forwardY =
    -Math.cos(car.angle);

  let targetVX =
    forwardX * car.speed;

  let targetVY =
    forwardY * car.speed;

  /*
    Física de drift.

    Quanto maior o drift,
    mais o carro desliza lateralmente.
  */

  const grip = drifting ? 0.88 : 0.96;

  car.vx =
    car.vx * grip +
    targetVX * (1 - grip);

  car.vy =
    car.vy * grip +
    targetVY * (1 - grip);

  car.x += car.vx;
  car.y += car.vy;

  /*
    Pontuação de drift
  */

  const lateralSpeed =
    Math.abs(
      car.vx * Math.cos(car.angle) -
      car.vy * Math.sin(car.angle)
    );

  if (
    drifting &&
    Math.abs(car.speed) > 2 &&
    lateralSpeed > 0.8
  ) {

    score += Math.floor(
      lateralSpeed * 2
    );

  }

  distance += Math.abs(car.speed);

  /*
    Nova volta
  */

  if (distance > 9000) {

    distance = 0;
    lap++;

    if (lap > 3) {
      finishRace();
    }
  }

  /*
    Câmera suave
  */

  camera.x +=
    (car.x - camera.x) * 0.08;

  camera.y +=
    (car.y - camera.y) * 0.08;

  updateHUD();
}

/* =========================
   PISTA
========================= */

function drawTrack() {

  ctx.save();

  ctx.translate(
    W / 2 - camera.x,
    H / 2 - camera.y
  );

  /*
    Gramado
  */

  ctx.fillStyle = "#263b29";

  ctx.fillRect(
    camera.x - W,
    camera.y - H,
    W * 2,
    H * 2
  );

  /*
    Linha externa
  */

  drawRoad("#e7e7e7", roadWidth + 30);

  /*
    Asfalto
  */

  drawRoad("#33363a", roadWidth);

  /*
    Linha central
  */

  drawRoad("#f5c542", 5, true);

  ctx.restore();
}

function drawRoad(color, width, dashed = false) {

  ctx.beginPath();

  ctx.moveTo(
    track[0].x,
    track[0].y
  );

  for (
    let i = 1;
    i < track.length;
    i++
  ) {

    const p = track[i];

    ctx.lineTo(
      p.x,
      p.y
    );
  }

  ctx.closePath();

  ctx.strokeStyle = color;
  ctx.lineWidth = width;

  if (dashed) {
    ctx.setLineDash([30, 30]);
  } else {
    ctx.setLineDash([]);
  }

  ctx.lineJoin = "round";
  ctx.lineCap = "round";

  ctx.stroke();

  ctx.setLineDash([]);
}

/* =========================
   CARRO
========================= */

function drawCar() {

  ctx.save();

  ctx.translate(
    W / 2,
    H / 2
  );

  ctx.rotate(
    car.angle
  );

  /*
    Sombra
  */

  ctx.fillStyle =
    "rgba(0,0,0,.4)";

  ctx.fillRect(
    -17,
    -27,
    34,
    60
  );

  /*
    Corpo
  */

  const gradient =
    ctx.createLinearGradient(
      -17, 0,
      17, 0
    );

  gradient.addColorStop(
    0,
    "#9e0018"
  );

  gradient.addColorStop(
    .5,
    "#ff304f"
  );

  gradient.addColorStop(
    1,
    "#9e0018"
  );

  ctx.fillStyle = gradient;

  roundRect(
    -17,
    -30,
    34,
    60,
    7
  );

  /*
    Vidro
  */

  ctx.fillStyle =
    "#152a35";

  roundRect(
    -12,
    -13,
    24,
    18,
    4
  );

  /*
    Capô
  */

  ctx.fillStyle =
    "#ff526a";

  roundRect(
    -11,
    8,
    22,
    13,
    3
  );

  /*
    Faróis
  */

  ctx.fillStyle =
    "#fff4a3";

  ctx.fillRect(
    -13,
    -28,
    8,
    5
  );

  ctx.fillRect(
    5,
    -28,
    8,
    5
  );

  /*
    Rodas
  */

  ctx.fillStyle =
    "#080808";

  ctx.fillRect(
    -20,
    -20,
    7,
    16
  );

  ctx.fillRect(
    13,
    -20,
    7,
    16
  );

  ctx.fillRect(
    -20,
    10,
    7,
    16
  );

  ctx.fillRect(
    13,
    10,
    7,
    16
  );

  ctx.restore();
}

function roundRect(
  x,
  y,
  w,
  h,
  r
) {

  ctx.beginPath();

  ctx.roundRect(
    x,
    y,
    w,
    h,
    r
  );

  ctx.fill();
}

/* =========================
   FUMAÇA DO DRIFT
========================= */

function drawSmoke() {

  const drifting =
    keys.Space;

  if (
    !drifting ||
    Math.abs(car.speed) < 2
  ) {
    return;
  }

  ctx.save();

  ctx.translate(
    W / 2,
    H / 2
  );

  ctx.rotate(
    car.angle
  );

  for (let i = 0; i < 5; i++) {

    const x =
      (Math.random() - .5) * 30;

    const y =
      25 + Math.random() * 15;

    ctx.beginPath();

    ctx.fillStyle =
      `rgba(220,220,220,${.15 + Math.random()*.2})`;

    ctx.arc(
      x,
      y,
      4 + Math.random() * 6,
      0,
      Math.PI * 2
    );

    ctx.fill();
  }

  ctx.restore();
}

/* =========================
   HUD
========================= */

function updateHUD() {

  document.getElementById("lap")
    .textContent =
    `${Math.min(lap,3)}/3`;

  document.getElementById("score")
    .textContent =
    Math.floor(score);

  document.getElementById("speed")
    .textContent =
    Math.floor(
      Math.abs(car.speed) * 25
    ) + " km/h";

  document.getElementById("nitroFill")
    .style.width =
    nitro + "%";
}

/* =========================
   FINAL
========================= */

function finishRace() {

  running = false;

  document.getElementById("menu").style.display =
    "flex";

  document.querySelector(".menuBox").innerHTML = `
    <h1>FIM!</h1>

    <p>
      Corrida terminada!
    </p>

    <p style="
      font-size:28px;
      color:#ff304f;
      margin-bottom:25px;
    ">
      🏆 ${Math.floor(score)} pontos
    </p>

    <button onclick="location.reload()">
      JOGAR NOVAMENTE
    </button>
  `;
}

/* =========================
   LOOP
========================= */

function gameLoop() {

  if (!running) return;

  updateCar();

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  drawTrack();

  drawSmoke();

  drawCar();

  requestAnimationFrame(
    gameLoop
  );
}

/* =========================
   START
========================= */

document.getElementById(
  "startButton"
).addEventListener(
  "click",
  startGame
);

</script>

</body>
</html>
