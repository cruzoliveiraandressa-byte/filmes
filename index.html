    <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Teen Wolf — Player</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #18242b 0%, #080a0c 45%, #030405 100%);
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      height: 70px;
      display: flex;
      align-items: center;
      padding: 0 5%;
      background: rgba(0, 0, 0, .75);
      border-bottom: 1px solid #222;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      color: #e50914;
      font-size: 26px;
      letter-spacing: 2px;
    }

    .container {
      width: min(1200px, 94%);
      margin: 30px auto 60px;
    }

    .player-box {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 15px 50px rgba(0,0,0,.65);
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 680px;
      background: #000;
    }

    .episode-info {
      padding: 22px 4px;
    }

    .episode-info h2 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .episode-info p {
      color: #aaa;
      line-height: 1.5;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 15px 0 30px;
    }

    button,
    select {
      border: none;
      border-radius: 7px;
      padding: 12px 16px;
      color: white;
      background: #20242a;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #343941;
    }

    .primary {
      background: #e50914;
    }

    .primary:hover {
      background: #b20710;
    }

    select {
      min-width: 160px;
    }

    .episodes-title {
      margin-bottom: 15px;
      font-size: 22px;
    }

    .episodes {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
    }

    .episode {
      padding: 18px;
      background: #13161a;
      border: 1px solid #252a30;
      border-radius: 9px;
      cursor: pointer;
      transition: .2s;
    }

    .episode:hover {
      transform: translateY(-2px);
      border-color: #555;
      background: #1c2025;
    }

    .episode.active {
      border-color: #e50914;
      background: #211316;
    }

    .episode strong {
      display: block;
      margin-bottom: 7px;
    }

    .episode small {
      color: #999;
    }

    .status {
      margin-top: 15px;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 20px;
      }

      .container {
        width: 96%;
        margin-top: 15px;
      }

      .episode-info h2 {
        font-size: 20px;
      }

      .episodes {
        grid-template-columns: 1fr;
      }

      button,
      select {
        flex: 1;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>TEEN WOLF</h1>
</header>

<main class="container">

  <div class="player-box">
    <video id="player" controls playsinline preload="metadata">
      Seu navegador não suporta vídeo HTML5.
    </video>
  </div>

  <div class="episode-info">
    <h2 id="title">Temporada 1 — Episódio 1</h2>
    <p id="description">
      Selecione um episódio para começar.
    </p>

    <div class="status" id="status"></div>
  </div>

  <div class="toolbar">

    <select id="season">
      <option value="1">Temporada 1</option>
      <option value="2">Temporada 2</option>
      <option value="3">Temporada 3</option>
      <option value="4">Temporada 4</option>
      <option value="5">Temporada 5</option>
      <option value="6">Temporada 6</option>
    </select>

    <button onclick="previousEpisode()">
      ◀ Anterior
    </button>

    <button class="primary" onclick="nextEpisode()">
      Próximo ▶
    </button>

  </div>

  <h2 class="episodes-title">Episódios</h2>

  <div id="episodes" class="episodes"></div>

</main>

<script>
  const player = document.getElementById("player");
  const title = document.getElementById("title");
  const description = document.getElementById("description");
  const episodesContainer =
    document.getElementById("episodes");
  const seasonSelect =
    document.getElementById("season");
  const status =
    document.getElementById("status");

  /*
    Quantidade de episódios por temporada.
  */

  const totalEpisodes = {
    1: 12,
    2: 12,
    3: 24,
    4: 12,
    5: 20,
    6: 20
  };

  let currentSeason = 1;
  let currentEpisode = 1;

  function getVideoPath(season, episode) {

    const s = String(season).padStart(2, "0");
    const e = String(episode).padStart(2, "0");

    return `videos/s${s}e${e}.mp4`;
  }

  function getProgressKey(season, episode) {
    return `teenwolf-${season}-${episode}`;
  }

  function createEpisodeList() {

    episodesContainer.innerHTML = "";

    const total = totalEpisodes[currentSeason];

    for (let i = 1; i <= total; i++) {

      const element =
        document.createElement("div");

      element.className = "episode";

      element.innerHTML = `
        <strong>Episódio ${i}</strong>
        <small>
          Temporada ${currentSeason}
        </small>
      `;

      element.onclick = () => {
        playEpisode(currentSeason, i);
      };

      episodesContainer.appendChild(element);
    }

    updateActiveEpisode();
  }

  function updateActiveEpisode() {

    const items =
      document.querySelectorAll(".episode");

    items.forEach((item, index) => {

      item.classList.toggle(
        "active",
        index + 1 === currentEpisode
      );

    });
  }

  function playEpisode(season, episode) {

    currentSeason = Number(season);
    currentEpisode = Number(episode);

    const path =
      getVideoPath(
        currentSeason,
        currentEpisode
      );

    player.src = path;

    title.textContent =
      `Temporada ${currentSeason} — Episódio ${currentEpisode}`;

    description.textContent =
      `Episódio ${currentEpisode} da temporada ${currentSeason}.`;

    status.textContent =
      `Arquivo: ${path}`;

    updateActiveEpisode();

    /*
      Recupera a posição salva.
    */

    const saved =
      localStorage.getItem(
        getProgressKey(
          currentSeason,
          currentEpisode
        )
      );

    player.addEventListener(
      "loadedmetadata",
      function restore() {

        if (saved) {

          const position =
            Number(saved);

          if (
            position > 0 &&
            position < player.duration - 10
          ) {
            player.currentTime = position;
          }
        }

        player.removeEventListener(
          "loadedmetadata",
          restore
        );
      }
    );

    player.load();

    /*
      Alguns navegadores bloqueiam
      autoplay com áudio.
    */

    player.play().catch(() => {});
  }

  function nextEpisode() {

    const total =
      totalEpisodes[currentSeason];

    if (currentEpisode < total) {

      playEpisode(
        currentSeason,
        currentEpisode + 1
      );

      return;
    }

    if (currentSeason < 6) {

      currentSeason++;

      seasonSelect.value =
        currentSeason;

      createEpisodeList();

      playEpisode(
        currentSeason,
        1
      );
    }
  }

  function previousEpisode() {

    if (currentEpisode > 1) {

      playEpisode(
        currentSeason,
        currentEpisode - 1
      );

      return;
    }

    if (currentSeason > 1) {

      currentSeason--;

      seasonSelect.value =
        currentSeason;

      createEpisodeList();

      playEpisode(
        currentSeason,
        totalEpisodes[currentSeason]
      );
    }
  }

  /*
    Salva automaticamente a posição
    do vídeo.
  */

  player.addEventListener("timeupdate", () => {

    if (!player.duration) return;

    localStorage.setItem(
      getProgressKey(
        currentSeason,
        currentEpisode
      ),
      player.currentTime
    );
  });

  /*
    Quando terminar, passa automaticamente
    para o próximo episódio.
  */

  player.addEventListener(
    "ended",
    nextEpisode
  );

  /*
    Tratamento de erro.
  */

  player.addEventListener(
    "error",
    () => {

      status.textContent =
        "Não foi possível carregar este vídeo. " +
        "Verifique se o arquivo existe na pasta videos/.";
    }
  );

  seasonSelect.addEventListener(
    "change",
    () => {

      currentSeason =
        Number(seasonSelect.value);

      currentEpisode = 1;

      createEpisodeList();

      playEpisode(
        currentSeason,
        currentEpisode
      );
    }
  );

  /*
    Inicialização.
  */

  createEpisodeList();

  playEpisode(1, 1);
</script>

</body>
</html>
