<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Streaming</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #08090d;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px 6%;
      background: #0d0e13;
      border-bottom: 1px solid #222;
    }

    header h1 {
      color: #e50914;
      font-size: 28px;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 30px auto;
    }

    .player {
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,.5);
    }

    video {
      display: block;
      width: 100%;
      max-height: 650px;
      background: #000;
    }

    .info {
      padding: 20px 0;
    }

    .info h2 {
      margin-bottom: 8px;
    }

    .info p {
      color: #aaa;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    button, select {
      background: #e50914;
      color: white;
      border: 0;
      padding: 12px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #b20710;
    }

    select {
      background: #22242b;
    }

    .episodes {
      margin-top: 30px;
    }

    .episodes h2 {
      margin-bottom: 15px;
    }

    .episode-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }

    .episode {
      padding: 16px;
      background: #15161c;
      border: 1px solid #25262d;
      border-radius: 8px;
      cursor: pointer;
      transition: .2s;
    }

    .episode:hover,
    .episode.active {
      background: #24252c;
      border-color: #e50914;
    }

    .episode strong {
      display: block;
      margin-bottom: 6px;
    }

    .episode span {
      color: #999;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 22px;
      }

      .container {
        width: 94%;
      }

      .episode-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>MEU STREAMING</h1>
</header>

<main class="container">

  <div class="player">
    <video id="videoPlayer" controls>
      <source id="videoSource" src="videos/temporada1-episodio1.mp4" type="video/mp4">
      Seu navegador não suporta vídeo HTML5.
    </video>
  </div>

  <div class="info">
    <h2 id="episodeTitle">Temporada 1 — Episódio 1</h2>
    <p id="episodeDescription">
      Selecione um episódio para começar a assistir.
    </p>
  </div>

  <div class="controls">
    <select id="seasonSelect">
      <option value="1">Temporada 1</option>
      <option value="2">Temporada 2</option>
      <option value="3">Temporada 3</option>
      <option value="4">Temporada 4</option>
      <option value="5">Temporada 5</option>
      <option value="6">Temporada 6</option>
    </select>

    <button onclick="previousEpisode()">← Anterior</button>
    <button onclick="nextEpisode()">Próximo →</button>
  </div>

  <section class="episodes">
    <h2>Episódios</h2>
    <div id="episodeList" class="episode-list"></div>
  </section>

</main>

<script>
  const videoPlayer = document.getElementById("videoPlayer");
  const videoSource = document.getElementById("videoSource");
  const episodeList = document.getElementById("episodeList");
  const episodeTitle = document.getElementById("episodeTitle");
  const episodeDescription = document.getElementById("episodeDescription");
  const seasonSelect = document.getElementById("seasonSelect");

  let currentSeason = 1;
  let currentEpisode = 1;

  // Altere os números conforme a quantidade de episódios
  const episodesPerSeason = {
    1: 12,
    2: 12,
    3: 24,
    4: 12,
    5: 20,
    6: 20
  };

  function loadEpisodes(season) {
    currentSeason = Number(season);
    currentEpisode = 1;

    episodeList.innerHTML = "";

    const total = episodesPerSeason[currentSeason];

    for (let i = 1; i <= total; i++) {

      const episode = document.createElement("div");
      episode.className = "episode";

      episode.innerHTML = `
        <strong>Episódio ${i}</strong>
        <span>Temporada ${currentSeason}</span>
      `;

      episode.onclick = () => playEpisode(currentSeason, i);

      episodeList.appendChild(episode);
    }

    playEpisode(currentSeason, 1);
  }

  function playEpisode(season, episode) {
    currentSeason = season;
    currentEpisode = episode;

    const file =
      `videos/temporada${season}-episodio${episode}.mp4`;

    videoSource.src = file;
    videoPlayer.load();

    episodeTitle.textContent =
      `Temporada ${season} — Episódio ${episode}`;

    episodeDescription.textContent =
      `Reproduzindo o episódio ${episode} da temporada ${season}.`;

    document.querySelectorAll(".episode").forEach((item, index) => {
      item.classList.toggle(
        "active",
        index + 1 === episode
      );
    });

    videoPlayer.play().catch(() => {});
  }

  function nextEpisode() {
    const total = episodesPerSeason[currentSeason];

    if (currentEpisode < total) {
      playEpisode(currentSeason, currentEpisode + 1);
    } else if (currentSeason < 6) {
      seasonSelect.value = currentSeason + 1;
      loadEpisodes(currentSeason + 1);
    }
  }

  function previousEpisode() {
    if (currentEpisode > 1) {
      playEpisode(currentSeason, currentEpisode - 1);
    }
  }

  videoPlayer.addEventListener("ended", nextEpisode);

  seasonSelect.addEventListener("change", () => {
    loadEpisodes(seasonSelect.value);
  });

  loadEpisodes(1);
</script>

</body>
</html>
