Claro — abaixo está um arquivo HTML completo, com bastante CSS, para criar um **coração rosa neon animado**, com efeito de brilho, pulsação, aura e partículas.

```
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Coração rosa neon animado feito com HTML e CSS">

    <title>💗 Coração Rosa Neon</title>

    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background:
                radial-gradient(
                    circle at center,
                    #260018 0%,
                    #13000d 35%,
                    #050005 75%,
                    #000000 100%
                );

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #fff;
        }

        /* =========================================================
           FUNDO
        ========================================================= */

        .background {
            position: fixed;
            inset: 0;

            overflow: hidden;

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(255, 0, 140, 0.08),
                    transparent 55%
                );

            z-index: 0;
        }

        /* Grade futurista */

        .grid {
            position: absolute;
            inset: -50%;

            background-image:
                linear-gradient(
                    rgba(255, 0, 140, 0.035) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255, 0, 140, 0.035) 1px,
                    transparent 1px
                );

            background-size: 60px 60px;

            transform:
                perspective(500px)
                rotateX(60deg);

            animation:
                gridMove 12s linear infinite;
        }

        @keyframes gridMove {

            0% {
                transform:
                    perspective(500px)
                    rotateX(60deg)
                    translateY(0);
            }

            100% {
                transform:
                    perspective(500px)
                    rotateX(60deg)
                    translateY(60px);
            }
        }

        /* =========================================================
           AURAS DO FUNDO
        ========================================================= */

        .orb {
            position: absolute;

            width: 300px;
            height: 300px;

            border-radius: 50%;

            filter: blur(80px);

            opacity: 0.25;

            animation:
                floatOrb 8s ease-in-out infinite alternate;
        }

        .orb.one {
            background: #ff0088;
            top: 5%;
            left: 10%;
        }

        .orb.two {
            background: #ff1493;
            right: 5%;
            bottom: 5%;

            animation-delay: -3s;
        }

        .orb.three {
            background: #ff00cc;
            left: 45%;
            top: 40%;

            width: 180px;
            height: 180px;

            animation-delay: -5s;
        }

        @keyframes floatOrb {

            from {
                transform: translate(0, 0) scale(0.8);
            }

            to {
                transform: translate(60px, -50px) scale(1.2);
            }
        }

        /* =========================================================
           CONTAINER PRINCIPAL
        ========================================================= */

        .scene {
            position: relative;

            width: 100%;
            height: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            z-index: 5;
        }

        /* =========================================================
           CORAÇÃO
        ========================================================= */

        .heart-container {

            position: relative;

            width: 300px;
            height: 300px;

            display: flex;
            justify-content: center;
            align-items: center;

            animation:
                heartbeat 1.35s ease-in-out infinite;
        }

        /*
           Aura gigante atrás do coração
        */

        .heart-aura {

            position: absolute;

            width: 210px;
            height: 210px;

            background: #ff008c;

            transform:
                rotate(-45deg);

            border-radius:
                25px 0 25px 0;

            filter:
                blur(65px);

            opacity: 0.75;

            animation:
                auraPulse 1.35s ease-in-out infinite;
        }

        .heart-aura::before,
        .heart-aura::after {

            content: "";

            position: absolute;

            width: 210px;
            height: 210px;

            background: #ff008c;

            border-radius: 50%;
        }

        .heart-aura::before {
            top: -105px;
            left: 0;
        }

        .heart-aura::after {
            left: 105px;
            top: 0;
        }

        /*
           Coração principal
        */

        .heart {

            position: absolute;

            width: 190px;
            height: 190px;

            background:

                radial-gradient(
                    circle at 35% 25%,
                    #ffb6df 0%,
                    #ff6fbd 8%,
                    #ff1493 35%,
                    #ff0080 65%,
                    #c00061 100%
                );

            transform:
                rotate(-45deg);

            border-radius:
                28px 0 28px 0;

            box-shadow:

                0 0 5px #fff,

                0 0 10px #ffb3dc,

                0 0 20px #ff69b4,

                0 0 35px #ff1493,

                0 0 60px #ff0088,

                0 0 100px rgba(255, 0, 136, 0.9),

                inset
                0 0 20px rgba(255, 255, 255, 0.35),

                inset
                -15px -15px 30px rgba(100, 0, 50, 0.3);

            animation:
                neonPulse 1.35s ease-in-out infinite;
        }

        /*
           Parte superior esquerda
        */

        .heart::before {

            content: "";

            position: absolute;

            width: 190px;
            height: 190px;

            left: 0;
            top: -95px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 35%,
                    #ffbce2,
                    #ff4fae 35%,
                    #ff0088 70%,
                    #c0005e
                );

            box-shadow:

                0 0 8px #fff,

                0 0 20px #ff69b4,

                0 0 45px #ff1493;
        }

        /*
           Parte superior direita
        */

        .heart::after {

            content: "";

            position: absolute;

            width: 190px;
            height: 190px;

            right: -95px;
            top: 0;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 35%,
                    #ffbce2,
                    #ff4fae 35%,
                    #ff0088 70%,
                    #c0005e
                );

            box-shadow:

                0 0 8px #fff,

                0 0 20px #ff69b4,

                0 0 45px #ff1493;
        }

        /* =========================================================
           ANIMAÇÕES DO CORAÇÃO
        ========================================================= */

        @keyframes heartbeat {

            0% {
                transform: scale(1);
            }

            15% {
                transform: scale(1.08);
            }

            30% {
                transform: scale(0.98);
            }

            45% {
                transform: scale(1.12);
            }

            70% {
                transform: scale(1);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes neonPulse {

            0%,
            100% {

                filter:
                    brightness(1);

                box-shadow:

                    0 0 5px #fff,
                    0 0 10px #ffb3dc,
                    0 0 20px #ff69b4,
                    0 0 35px #ff1493,
                    0 0 60px #ff0088,
                    0 0 100px rgba(255, 0, 136, 0.8);
            }

            50% {

                filter:
                    brightness(1.35);

                box-shadow:

                    0 0 8px #fff,
                    0 0 20px #fff,
                    0 0 35px #ffb3dc,
                    0 0 60px #ff69b4,
                    0 0 100px #ff1493,
                    0 0 160px rgba(255, 0, 136, 0.95);
            }
        }

        @keyframes auraPulse {

            0%,
            100% {
                opacity: 0.35;
                transform:
                    rotate(-45deg)
                    scale(0.85);
            }

            50% {
                opacity: 0.8;
                transform:
                    rotate(-45deg)
                    scale(1.15);
            }
        }

        /* =========================================================
           REFLEXOS NO CORAÇÃO
        ========================================================= */

        .shine {

            position: absolute;

            width: 70px;
            height: 25px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.95),
                    transparent
                );

            border-radius: 50%;

            filter:
                blur(4px);

            transform:
                rotate(-45deg);

            top: 65px;
            left: 75px;

            opacity: 0.8;

            animation:
                shineMove 3s ease-in-out infinite;
        }

        @keyframes shineMove {

            0% {
                opacity: 0;
                transform:
                    rotate(-45deg)
                    translateX(-20px);
            }

            20% {
                opacity: 0.9;
            }

            50% {
                opacity: 0.4;
            }

            80% {
                opacity: 0;
                transform:
                    rotate(-45deg)
                    translateX(80px);
            }

            100% {
                opacity: 0;
            }
        }

        /* =========================================================
           ANEL NEON
        ========================================================= */

        .ring {

            position: absolute;

            width: 430px;
            height: 430px;

            border-radius: 50%;

            border:
                1px solid rgba(255, 20, 147, 0.35);

            box-shadow:

                0 0 10px rgba(255, 20, 147, 0.25),
                inset 0 0 20px rgba(255, 20, 147, 0.1);

            animation:
                rotateRing 15s linear infinite;
        }

        .ring::before {

            content: "";

            position: absolute;

            width: 8px;
            height: 8px;

            background: #ff69b4;

            border-radius: 50%;

            top: 30px;
            left: 50%;

            box-shadow:

                0 0 5px #fff,
                0 0 15px #ff69b4,
                0 0 30px #ff1493;
        }

        .ring::after {

            content: "";

            position: absolute;

            width: 5px;
            height: 5px;

            background: #fff;

            border-radius: 50%;

            bottom: 60px;
            right: 20%;

            box-shadow:
                0 0 10px #ff1493,
                0 0 20px #ff1493;
        }

        @keyframes rotateRing {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* =========================================================
           PARTÍCULAS
        ========================================================= */

        .particles {

            position: absolute;

            inset: 0;

            pointer-events: none;
        }

        .particle {

            position: absolute;

            width: 4px;
            height: 4px;

            background: #ff8ac7;

            border-radius: 50%;

            box-shadow:

                0 0 5px #fff,
                0 0 10px #ff69b4,
                0 0 20px #ff1493;

            animation:
                particleFloat
                var(--duration)
                ease-in-out
                infinite;

            animation-delay:
                var(--delay);
        }

        .particle:nth-child(1) {
            left: 15%;
            top: 30%;
            --duration: 5s;
            --delay: -1s;
        }

        .particle:nth-child(2) {
            left: 22%;
            top: 65%;
            --duration: 7s;
            --delay: -3s;
        }

        .particle:nth-child(3) {
            left: 30%;
            top: 15%;
            --duration: 6s;
            --delay: -2s;
        }

        .particle:nth-child(4) {
            left: 75%;
            top: 20%;
            --duration: 8s;
            --delay: -4s;
        }

        .particle:nth-child(5) {
            left: 85%;
            top: 50%;
            --duration: 6s;
            --delay: -1s;
        }

        .particle:nth-child(6) {
            left: 72%;
            top: 75%;
            --duration: 9s;
            --delay: -5s;
        }

        .particle:nth-child(7) {
            left: 40%;
            top: 85%;
            --duration: 7s;
            --delay: -2s;
        }

        .particle:nth-child(8) {
            left: 55%;
            top: 10%;
            --duration: 5s;
            --delay: -4s;
        }

        .particle:nth-child(9) {
            left: 10%;
            top: 80%;
            --duration: 8s;
            --delay: -3s;
        }

        .particle:nth-child(10) {
            left: 92%;
            top: 80%;
            --duration: 6s;
            --delay: -1s;
        }

        @keyframes particleFloat {

            0% {
                transform:
                    translateY(30px)
                    scale(0);

                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            50% {
                transform:
                    translateY(-60px)
                    scale(1.4);

                opacity: 1;
            }

            80% {
                opacity: 0.4;
            }

            100% {
                transform:
                    translateY(-140px)
                    scale(0);

                opacity: 0;
            }
        }

        /* =========================================================
           PEQUENOS CORAÇÕES
        ========================================================= */

        .mini-heart {

            position: absolute;

            color: #ff69b4;

            font-size: 20px;

            text-shadow:

                0 0 5px #fff,
                0 0 10px #ff69b4,
                0 0 20px #ff1493,
                0 0 30px #ff0088;

            animation:
                miniFloat 4s ease-in-out infinite;
        }

        .mini-heart.one {
            top: 20%;
            left: 25%;
            animation-delay: -1s;
        }

        .mini-heart.two {
            top: 25%;
            right: 25%;
            font-size: 14px;
            animation-delay: -2s;
        }

        .mini-heart.three {
            bottom: 20%;
            left: 28%;
            font-size: 16px;
            animation-delay: -3s;
        }

        .mini-heart.four {
            bottom: 25%;
            right: 27%;
            font-size: 22px;
            animation-delay: -1.5s;
        }

        @keyframes miniFloat {

            0%,
            100% {
                transform:
                    translateY(0)
                    scale(1)
                    rotate(-10deg);

                opacity: 0.4;
            }

            50% {
                transform:
                    translateY(-30px)
                    scale(1.4)
                    rotate(10deg);

                opacity: 1;
            }
        }

        /* =========================================================
           TEXTO
        ========================================================= */

        .message {

            position: absolute;

            bottom: 55px;

            text-align: center;

            letter-spacing: 5px;

            text-transform: uppercase;

            font-size: 13px;

            color: #ffb6dc;

            text-shadow:

                0 0 5px #ff69b4,
                0 0 15px #ff1493,
                0 0 30px #ff0088;

            animation:
                textPulse 2s ease-in-out infinite;
        }

        @keyframes textPulse {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        /* =========================================================
           BORDA DA TELA
        ========================================================= */

        .screen-border {

            position: fixed;

            inset: 15px;

            border:
                1px solid rgba(255, 20, 147, 0.12);

            box-shadow:
                inset 0 0 40px rgba(255, 0, 136, 0.05);

            pointer-events: none;

            z-index: 20;
        }

        .screen-border::before,
        .screen-border::after {

            content: "";

            position: absolute;

            width: 70px;
            height: 70px;

            border-color:
                rgba(255, 20, 147, 0.6);

            border-style: solid;
        }

        .screen-border::before {

            top: -1px;
            left: -1px;

            border-width:
                2px 0 0 2px;
        }

        .screen-border::after {

            bottom: -1px;
            right: -1px;

            border-width:
                0 2px 2px 0;
        }

        /* =========================================================
           RESPONSIVIDADE
        ========================================================= */

        @media (max-width: 600px) {

            .heart-container {
                transform: scale(0.72);
            }

            .ring {
                transform: scale(0.75);
            }

            .message {
                bottom: 35px;
                font-size: 10px;
                letter-spacing: 3px;
            }

            .screen-border {
                inset: 8px;
            }
        }

        @media (max-height: 600px) {

            .heart-container {
                transform: scale(0.65);
            }

            .message {
                bottom: 15px;
            }
        }

    </style>
</head>

<body>

    <!-- =========================================================
         FUNDO
    ========================================================= -->

    <div class="background">

        <div class="grid"></div>

        <div class="orb one"></div>
        <div class="orb two"></div>
        <div class="orb three"></div>

    </div>

    <!-- =========================================================
         BORDA DA TELA
    ========================================================= -->

    <div class="screen-border"></div>

    <!-- =========================================================
         PARTÍCULAS
    ========================================================= -->

    <div class="particles">

        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>

    </div>

    <!-- =========================================================
         PEQUENOS CORAÇÕES
    ========================================================= -->

    <div class="mini-heart one">♥</div>
    <div class="mini-heart two">♥</div>
    <div class="mini-heart three">♥</div>
    <div class="mini-heart four">♥</div>

    <!-- =========================================================
         CENA PRINCIPAL
    ========================================================= -->

    <main class="scene">

        <div class="ring"></div>

        <div class="heart-container">

            <!-- Aura externa -->
            <div class="heart-aura"></div>

            <!-- Coração -->
            <div class="heart"></div>

            <!-- Reflexo -->
            <div class="shine"></div>

        </div>

    </main>

    <!-- =========================================================
         TEXTO
    ========================================================= -->
